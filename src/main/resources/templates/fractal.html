<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>Java Fractal Tree</title>
    <style>
        body { background: #f0f0f0; font-family: sans-serif; text-align: center; }
        svg { background: white; border: 1px solid #ccc; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        line { stroke: #2c3e50; stroke-width: 1; stroke-linecap: round; }
    </style>
</head>
<body>
<h1>Векторный фрактал на Java</h1>

<form action="/" method="get">
    Глубина рекурсии:
    <input type="number" name="depth" th:value="${currentDepth}" min="1" max="15">
    <button type="submit">Отрисовать</button>
</form>
<br>

<!-- Отрисовка линий через SVG -->
<svg width="800" height="700">
    <line th:each="l : ${lines}"
          th:x1="${l.x1}" th:y1="${l.y1}"
          th:x2="${l.x2}" th:y2="${l.y2}" />
</svg>
</body>
</html>
